crons:
  - name: meta-token-check
    description: "Daily 09:00 IST check of the Meta Ads token; emails admin 7/3/1 days before expiry"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/meta-token-check"
    method: POST
    enabled: true
